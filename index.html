<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端衣物資料庫檢索系統 | Clothing Search Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .card-img-wrap { aspect-ratio: 4 / 5; overflow: hidden; }
        .card-img-wrap img { transition: transform 0.4s ease; }
        .product-card:hover .card-img-wrap img { transform: scale(1.06); }
    </style>
</head>
<body class="text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-sm">TiDB API</span>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">衣物資料庫連結應用系統</h1>
            </div>
            <div class="text-xs text-slate-500 hidden sm:block">
                資料來源：TiDB Cloud MySQL · 總計 <span id="totalCountBadge" class="font-bold text-indigo-600">60</span> 件商品
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- 數據儀表板區塊 (KPI + 圖表) -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 grid grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center">
                    <p class="text-xs font-medium text-slate-500">資料庫商品總數</p>
                    <p id="kpiTotal" class="text-3xl font-bold text-slate-900 mt-1">-</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center">
                    <p class="text-xs font-medium text-slate-500">總庫存件數</p>
                    <p id="kpiStock" class="text-3xl font-bold text-emerald-600 mt-1">-</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center">
                    <p class="text-xs font-medium text-slate-500">平均單價 (TWD)</p>
                    <p id="kpiAvgPrice" class="text-3xl font-bold text-indigo-600 mt-1">-</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center">
                    <p class="text-xs font-medium text-slate-500">服飾分類數</p>
                    <p class="text-3xl font-bold text-amber-600 mt-1">5 類</p>
                </div>
            </div>
            <div class="lg:col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-700 mb-3">各服飾類別庫存分佈統計</h2>
                <div class="h-44">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 搜尋與類別篩選控制列 -->
        <section class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-col md:flex-row gap-4 justify-between">
                <div class="relative flex-1">
                    <input type="text" id="searchInput" placeholder="搜尋商品名稱、貨號 (如 CL-1001) 或顏色..." 
                        class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <select id="sortSelect" class="px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="default">預設排序 (編號)</option>
                    <option value="price-asc">價格：由低到高</option>
                    <option value="price-desc">價格：由高到低</option>
                    <option value="stock-desc">庫存：由多到少</option>
                </select>
            </div>
            <!-- 類別按鈕列 -->
            <div class="flex flex-wrap gap-2" id="categoryButtons">
                <button data-cat="ALL" class="cat-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white transition">全部 (60)</button>
                <button data-cat="上衣" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">上衣</button>
                <button data-cat="褲裝" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">褲裝</button>
                <button data-cat="外套" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">外套</button>
                <button data-cat="洋裝" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">洋裝</button>
                <button data-cat="配件" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 transition">配件</button>
            </div>
        </section>

        <!-- 商品卡片網格區 (60 件商品) -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800">商品型錄清單</h2>
                <span id="resultCount" class="text-sm text-slate-500">顯示 60 件商品</span>
            </div>
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                <!-- 卡片由 JS 動態渲染 -->
            </div>
        </section>

    </main>

    <script>
        let allProducts = [];
        let currentCategory = 'ALL';

        async function fetchProducts() {
            try {
                const res = await fetch(`./products.json?t=${Date.now()}`);
                allProducts = await res.json();
                updateDashboard(allProducts);
                renderProducts();
            } catch (err) {
                console.error("API 讀取失敗:", err);
                document.getElementById('productGrid').innerHTML = `<p class="col-span-full text-center text-red-500 py-10">無法載入 products.json，請確認檔案已上傳至 GitHub 倉庫根目錄。</p>`;
            }
        }

        function updateDashboard(data) {
            document.getElementById('kpiTotal').textContent = data.length;
            const totalStock = data.reduce((sum, item) => sum + item.stock, 0);
            const avgPrice = Math.round(data.reduce((sum, item) => sum + item.price, 0) / data.length);
            document.getElementById('kpiStock').textContent = totalStock.toLocaleString();
            document.getElementById('kpiAvgPrice').textContent = `$${avgPrice.toLocaleString()}`;

            const catMap = {};
            data.forEach(p => {
                catMap[p.category] = (catMap[p.category] || 0) + p.stock;
            });

            new Chart(document.getElementById('categoryChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        label: '總庫存件數',
                        data: Object.values(catMap),
                        backgroundColor: ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function renderProducts() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allProducts.filter(p => {
                const matchCat = currentCategory === 'ALL' || p.category === currentCategory;
                const matchKey = !keyword || 
                    p.product_name.toLowerCase().includes(keyword) || 
                    p.sku.toLowerCase().includes(keyword) || 
                    p.color.toLowerCase().includes(keyword);
                return matchCat && matchKey;
            });

            if (sortBy === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            if (sortBy === 'price-desc') filtered.sort((a, b) => b.price - a.price);
            if (sortBy === 'stock-desc') filtered.sort((a, b) => b.stock - a.stock);

            document.getElementById('resultCount').textContent = `顯示 ${filtered.length} 件商品`;
            const grid = document.getElementById('productGrid');
            
            grid.innerHTML = filtered.map(item => `
                <article class="product-card bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <div class="card-img-wrap relative bg-slate-100">
                        <img src="${item.image_url}" alt="${item.product_name}" loading="lazy" class="w-full h-full object-cover">
                        <span class="absolute top-2.5 left-2.5 bg-slate-900/75 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-full font-medium">
                            ${item.category}
                        </span>
                        <span class="absolute bottom-2.5 right-2.5 bg-white/90 text-slate-700 text-[11px] px-2 py-0.5 rounded font-mono">
                            ${item.sku}
                        </span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h3 class="font-bold text-slate-900 text-sm line-clamp-1" title="${item.product_name}">${item.product_name}</h3>
                            <div class="flex items-center gap-2 mt-1.5 text-xs text-slate-500">
                                <span class="px-2 py-0.5 bg-slate-100 rounded">${item.color}</span>
                                <span class="px-2 py-0.5 bg-slate-100 rounded">尺寸 ${item.size}</span>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-base font-bold text-indigo-600">NT$ ${item.price.toLocaleString()}</span>
                            <span class="text-xs ${item.stock < 15 ? 'text-rose-600 font-bold' : 'text-slate-400'}">
                                庫存 ${item.stock}
                            </span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderProducts);
        document.getElementById('sortSelect').addEventListener('change', renderProducts);
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white');
                    b.classList.add('bg-slate-100', 'text-slate-700');
                });
                e.target.classList.remove('bg-slate-100', 'text-slate-700');
                e.target.classList.add('bg-indigo-600', 'text-white');
                currentCategory = e.target.dataset.cat;
                renderProducts();
            });
        });

        fetchProducts();
    </script>
</body>
</html>
